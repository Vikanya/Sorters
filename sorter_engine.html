<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorter Engine</title>
    <style>
        :root { 
            --primary: #b197fc; 
            --accent: #63e6be;  
            --bg: #1a1b1e;      
            --card-bg: #25262b; 
            --text: #ced4da;    
            --border: #373a40;
            --glow-color: rgba(177, 151, 252, 0.4);
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            padding: 0; margin: 0; 
            display: flex; flex-direction: column;
            height: 100vh; 
            height: 100dvh; /* Use dynamic viewport height for mobile browsers */
            overflow: hidden;
        }
        
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: #141517; border-bottom: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
        }
        .nav-btn {
            text-decoration: none; color: var(--text); font-size: 11px; font-weight: bold;
            padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

        header { flex-shrink: 0; padding: 10px 20px 5px 20px; }
        #progressContainer { width: 100%; height: 4px; background: var(--border); margin: 5px auto; border-radius: 5px; }
        #progressBar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        
        .battle-area { 
            display: flex; 
            flex: 1; /* Take up all available remaining vertical space */
            justify-content: center; 
            align-items: stretch;
            gap: 20px; 
            padding: 10px 20px 20px 20px; /* Balanced padding */
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .choice-card { 
            flex: 1; display: flex; flex-direction: column;
            background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 18px; padding: 15px; cursor: pointer; 
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .choice-card.focus { flex: 2.8; border-color: var(--primary); box-shadow: 0 0 30px var(--glow-color); }
        .choice-card.dim { flex: 0.4; opacity: 0.25; filter: grayscale(0.8) blur(1px); }

        .song-name { 
            font-weight: 600; font-size: 1.8vw; 
            color: #fff; min-height: 2.2em; 
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; text-align: center;
            flex-shrink: 0;
        }
        
        .mode-text .song-name { font-size: 3vw; flex: 1; }
        .mode-big-names-video .song-name { font-size: 3.5vw; margin-bottom: 10px; }

        .visual-container { 
            flex: 1; width: 100%; background: #000; border-radius: 12px; 
            overflow: hidden; border: 3px solid transparent;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            /* Ensures container expands to fill flex parent */
            height: 100%; 
        }
        
        /* Force inner content to fill container */
        .visual-container > div, 
        .visual-container iframe, 
        .visual-container img { 
            width: 100% !important; 
            height: 100% !important; 
            border: none; 
            display: block;
        }
        
        .visual-container img { object-fit: cover; }
        .mode-panorama .visual-container img { object-fit: contain; background: #000; }

        .video-playing { border-color: var(--primary); }

        .img-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: 0.2s; z-index: 5;
            opacity: 0;
        }
        .visual-container:hover .img-nav { opacity: 1; }
        .img-nav:hover { background: var(--primary); color: #000; }
        .img-nav.prev { left: 10px; }
        .img-nav.next { right: 10px; }
        
        .img-counter {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.6); color: white; padding: 4px 8px;
            border-radius: 10px; font-size: 10px; font-weight: bold;
            pointer-events: none;
        }

        .middle-controls { display: flex; flex-direction: column; justify-content: center; gap: 10px; width: 130px; flex-shrink: 0; }
        .btn { 
            padding: 10px; border: 1px solid var(--border); border-radius: 10px; 
            cursor: pointer; background: var(--card-bg); color: var(--text); 
            font-size: 10px; font-weight: bold; transition: 0.2s;
        }
        .btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-undo { color: #ff8787; border-color: rgba(255, 135, 135, 0.2); }

        .instruction-footer { flex-shrink: 0; padding: 10px; font-size: 10px; color: #5c5f66; background: #141517; }
        .key-cap { color: var(--primary); font-weight: bold; padding: 0 4px; }
        
        #resultField { overflow-y: auto; background: var(--bg); flex: 1; }
        table { width: 85%; max-width: 600px; margin: 30px auto; border-collapse: collapse; border-radius: 12px; overflow: hidden; background: var(--card-bg); }
        th { background: var(--primary); color: #000; padding: 15px; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); color: #fff; text-align: center; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="top-bar">
        <a href="index.html" class="nav-btn">⇠ Library</a>
        <div>
            <select id="layoutPicker" onchange="changeLayout(this.value)" style="background: #000; color: #fff; border: 1px solid var(--border); border-radius: 5px; font-size: 10px; padding: 4px;">
                <option value="AZERTY">AZERTY</option>
                <option value="QWERTY">QWERTY</option>
            </select>
        </div>
    </div>

    <header>
        <h1 id="page-title" style="margin:5px; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary);">Loading...</h1>
        <div id="battleNumber" style="font-size: 11px; opacity: 0.6;">Checking Data...</div>
        <div id="progressContainer"><div id="progressBar"></div></div>
    </header>

    <div class="battle-area" id="battleArena">
        <div id="cardLeft" class="choice-card" onclick="if(!finishFlag) sortList(-1)">
            <div id="leftField" class="song-name">---</div>
            <div id="wrapperLeft" class="visual-container hidden" onclick="event.stopPropagation();">
                <button class="img-nav prev hidden" onclick="navigateImages('Left', -1); event.stopPropagation();">‹</button>
                <div id="contentLeft"></div>
                <button class="img-nav next hidden" onclick="navigateImages('Left', 1); event.stopPropagation();">›</button>
                <div id="counterLeft" class="img-counter hidden">1/1</div>
            </div>
            <span id="hintLeft" class="key-hint" style="margin-top:10px; font-size:10px; opacity:0.4;">[<span class="left-key-label">A</span>] PLAY</span>
        </div>

        <div class="middle-controls">
            <div class="btn" onclick="if(!finishFlag) sortList(0)">LIKE BOTH</div>
            <div class="btn" onclick="if(!finishFlag) sortList(0)">NO OPINION</div>
            <button id="undoBtn" class="btn btn-undo" onclick="undo()" disabled>UNDO</button>
        </div>

        <div id="cardRight" class="choice-card" onclick="if(!finishFlag) sortList(1)">
            <div id="rightField" class="song-name">---</div>
            <div id="wrapperRight" class="visual-container hidden" onclick="event.stopPropagation();">
                <button class="img-nav prev hidden" onclick="navigateImages('Right', -1); event.stopPropagation();">‹</button>
                <div id="contentRight"></div>
                <button class="img-nav next hidden" onclick="navigateImages('Right', 1); event.stopPropagation();">›</button>
                <div id="counterRight" class="img-counter hidden">1/1</div>
            </div>
            <span id="hintRight" class="key-hint" style="margin-top:10px; font-size:10px; opacity:0.4;">[<span class="right-key-label">Z</span>] PLAY</span>
        </div>
    </div>

    <div class="instruction-footer">
        <span class="key-cap">← / →</span> WINNER | <span class="key-cap">↓</span> TIE | <span class="key-cap">Ctrl+Z</span> UNDO <span id="video-keys-hint">| <span class="key-cap" id="hint-left">A</span> / <span class="key-cap" id="hint-right">Z</span> VIDEO</span>
    </div>

    <div id="resultField"></div>

<script>
var namMember = [], videoIds = [], linkedImages = [], displayMode = "video"; 
var playerLeft, playerRight, leftReady = false, rightReady = false;
var imgIdxLeft = 0, imgIdxRight = 0;

async function loadSorterData() {
    const urlParams = new URLSearchParams(window.location.search);
    const dataPath = urlParams.get('data');
    
    const battleLabel = document.getElementById('battleNumber');
    
    if (!dataPath) {
        battleLabel.style.color = "#ff8787";
        battleLabel.innerText = "ERROR: No data file specified.";
        return;
    }

    try {
        const response = await fetch(dataPath);
        if (!response.ok) throw new Error(`FILE NOT FOUND: ${response.status}`);
        
        let data;
        try { data = await response.json(); } 
        catch (jsonErr) { throw new Error("INVALID JSON FORMAT"); }
        
        if (!data.names || data.names.length < 2) throw new Error("DATA ERROR: Too few entries.");

        namMember = data.names;
        videoIds = data.ids || [];
        linkedImages = data.images || [];
        displayMode = data.displayMode || "video";

        setupLayoutMode();

        const fileName = dataPath.split('/').pop().replace('.json', '').replace(/[-_]/g, ' ');
        document.title = fileName.toUpperCase();
        document.getElementById('page-title').innerText = fileName;

        if (displayMode.includes("video")) initYouTubePlayers(); 
        else { initList(); updateUI(); }
    } catch (e) {
        battleLabel.style.color = "#ff8787";
        battleLabel.innerText = e.message;
    }
}

function setupLayoutMode() {
    const arena = document.getElementById('battleArena');
    arena.className = 'battle-area mode-' + displayMode;
    const isVideo = displayMode.includes("video");
    const isImage = (displayMode === "linked-images" || displayMode === "panorama");

    document.querySelectorAll('.visual-container').forEach(el => el.classList.toggle('hidden', !isVideo && !isImage));
    document.querySelectorAll('.key-hint').forEach(el => el.classList.toggle('hidden', !isVideo));
    document.getElementById('video-keys-hint').classList.toggle('hidden', !isVideo);

    if (isVideo) {
        document.getElementById('contentLeft').innerHTML = '<div id="ytPlayerLeft"></div>';
        document.getElementById('contentRight').innerHTML = '<div id="ytPlayerRight"></div>';
    } else if (isImage) {
        document.getElementById('contentLeft').innerHTML = '<img id="imgLeft" src="" alt="">';
        document.getElementById('contentRight').innerHTML = '<img id="imgRight" src="" alt="">';
    }
}

function initYouTubePlayers() {
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
}

function onYouTubeIframeAPIReady() {
    playerLeft = new YT.Player('ytPlayerLeft', { height: '100%', width: '100%', videoId: '', playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 'onReady': () => { leftReady = true; checkPlayersReady(); }, 'onStateChange': (e) => handleStateChange(e, 'Left') }
    });
    playerRight = new YT.Player('ytPlayerRight', { height: '100%', width: '100%', videoId: '', playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 'onReady': () => { rightReady = true; checkPlayersReady(); }, 'onStateChange': (e) => handleStateChange(e, 'Right') }
    });
}

function checkPlayersReady() { if (leftReady && rightReady) { initList(); updateUI(); } }

function handleStateChange(event, side) {
    const wrapper = document.getElementById('wrapper' + side);
    const card = document.getElementById('card' + side);
    const otherCard = document.getElementById(side === 'Left' ? 'cardRight' : 'cardLeft');
    if (event.data == 1) { wrapper.classList.add('video-playing'); card.classList.add('focus'); otherCard.classList.add('dim'); } 
    else { wrapper.classList.remove('video-playing'); card.classList.remove('focus'); otherCard.classList.remove('dim'); }
}

var lstMember = [], parent = [], equal = [], rec = [], historyStack = [];
var cmp1, cmp2, head1, head2, nrec, numQuestion, totalSize, finishSize, finishFlag = 0;

function initList(){
    var n = 0;
    lstMember[n] = namMember.map((_, i) => i);
    parent[n] = -1; totalSize = 0; n++;
    for (var i=0; i<lstMember.length; i++) {
        if(lstMember[i].length>=2) {
            var mid = Math.ceil(lstMember[i].length/2);
            lstMember[n] = lstMember[i].slice(0,mid); totalSize += lstMember[n].length; parent[n] = i; n++;
            lstMember[n] = lstMember[i].slice(mid); totalSize += lstMember[n].length; parent[n] = i; n++;
        }
    }
    equal = new Array(namMember.length + 1).fill(-1);
    cmp1 = lstMember.length-2; cmp2 = lstMember.length-1;
    head1 = head2 = nrec = finishSize = 0; numQuestion = 1;
}

function sortList(flag){
    saveState();
    if (flag < 0) processChoice(cmp1, 'head1');
    else if (flag > 0) processChoice(cmp2, 'head2');
    else { processChoice(cmp1, 'head1'); equal[rec[nrec-1]] = lstMember[cmp2][head2]; processChoice(cmp2, 'head2'); }
    if (head1 < lstMember[cmp1].length && head2 == lstMember[cmp2].length) { while (head1 < lstMember[cmp1].length) processChoice(cmp1, 'head1'); } 
    else if (head1 == lstMember[cmp1].length && head2 < lstMember[cmp2].length) { while (head2 < lstMember[cmp2].length) processChoice(cmp2, 'head2'); }
    if (head1 == lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
        for (var i=0; i<lstMember[cmp1].length+lstMember[cmp2].length; i++) lstMember[parent[cmp1]][i] = rec[i];
        lstMember.pop(); lstMember.pop(); cmp1 -= 2; cmp2 -= 2; head1 = head2 = nrec = 0;
    }
    if (cmp1 < 0) { finishFlag = 1; updateUI(); showResult(); } else { updateUI(); }
}

function processChoice(targetCmp, targetHead) {
    rec[nrec++] = lstMember[targetCmp][window[targetHead]++]; finishSize++;
    while (equal[rec[nrec-1]] != -1) { rec[nrec++] = lstMember[targetCmp][window[targetHead]++]; finishSize++; }
}

function navigateImages(side, dir) {
    const idx = (side === 'Left') ? lstMember[cmp1][head1] : lstMember[cmp2][head2];
    const group = linkedImages[idx];
    if (!Array.isArray(group)) return;

    if (side === 'Left') {
        imgIdxLeft = (imgIdxLeft + dir + group.length) % group.length;
        document.getElementById('imgLeft').src = group[imgIdxLeft];
        document.getElementById('counterLeft').innerText = `${imgIdxLeft + 1}/${group.length}`;
    } else {
        imgIdxRight = (imgIdxRight + dir + group.length) % group.length;
        document.getElementById('imgRight').src = group[imgIdxRight];
        document.getElementById('counterRight').innerText = `${imgIdxRight + 1}/${group.length}`;
    }
}

async function updateUI(isUndo = false) {
    var percent = Math.floor(finishSize * 100 / totalSize);
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("battleNumber").innerHTML = finishFlag ? "FINISHED!" : `QUESTION ${numQuestion} (${percent}%)`;
    if (!finishFlag) {
        const LIdx = lstMember[cmp1][head1], RIdx = lstMember[cmp2][head2];
        document.getElementById("leftField").innerHTML = namMember[LIdx];
        document.getElementById("rightField").innerHTML = namMember[RIdx];
        document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('focus', 'dim'));
        document.querySelectorAll('.visual-container').forEach(w => w.classList.remove('video-playing'));
        
        if (displayMode.includes("video")) {
            if (playerLeft.cueVideoById) playerLeft.cueVideoById(videoIds[LIdx]);
            if (playerRight.cueVideoById) playerRight.cueVideoById(videoIds[RIdx]);
        }
        
        imgIdxLeft = 0; imgIdxRight = 0;

        if (displayMode === "linked-images" || displayMode === "panorama") {
            const setupImgs = (side, idx) => {
                const group = linkedImages[idx];
                const isArr = Array.isArray(group);
                const url = isArr ? group[0] : group;
                const count = isArr ? group.length : 1;
                
                document.getElementById('img' + side).src = url || '';
                document.getElementById('counter' + side).innerText = `1/${count}`;
                document.getElementById('counter' + side).classList.toggle('hidden', count <= 1);
                document.getElementById('wrapper' + side).querySelectorAll('.img-nav').forEach(btn => {
                    btn.classList.toggle('hidden', count <= 1);
                });
            };
            setupImgs('Left', LIdx);
            setupImgs('Right', RIdx);
        }
        if (!isUndo) numQuestion++;
    }
}

function changeLayout(val) {
    const lK = (val === "AZERTY") ? "A" : "Q", rK = (val === "AZERTY") ? "Z" : "W";
    document.querySelectorAll('.left-key-label').forEach(el => el.innerText = lK);
    document.querySelectorAll('.right-key-label').forEach(el => el.innerText = rK);
    document.getElementById('hint-left').innerText = lK; document.getElementById('hint-right').innerText = rK;
}

function saveState() { historyStack.push(JSON.parse(JSON.stringify({lstMember, parent, equal, rec, cmp1, cmp2, head1, head2, nrec, numQuestion, finishSize, imgIdxLeft, imgIdxRight}))); document.getElementById("undoBtn").disabled = false; }
function undo() {
    if (historyStack.length === 0) return;
    var s = historyStack.pop(); Object.assign(window, s); finishFlag = 0; numQuestion--;
    document.getElementById("resultField").innerHTML = ""; if (historyStack.length === 0) document.getElementById("undoBtn").disabled = true;
    updateUI(true);
}

function togglePlayer(player) { if (!player || !player.getPlayerState) return; if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); }

function showResult() {
    var ranking = 1, sameRank = 1, str = "<table><tr><th>Rank</th><th>Name</th></tr>";
    for (var i=0; i<namMember.length; i++) {
        var idx = lstMember[0][i]; str += `<tr><td>${ranking}</td><td>${namMember[idx]}</td></tr>`;
        if (i < namMember.length - 1) { if (equal[idx] == lstMember[0][i+1]) sameRank++; else { ranking += sameRank; sameRank = 1; } }
    }
    document.getElementById('battleArena').classList.add('hidden');
    document.getElementById("resultField").innerHTML = str + "</table>";
}

window.addEventListener('keydown', (e) => {
    if (e.target.tagName == 'INPUT' || e.target.tagName == 'TEXTAREA') return;
    if (e.ctrlKey && e.key === 'z') { undo(); return; }
    if (displayMode.includes("video")) { if (e.code === 'KeyQ') togglePlayer(playerLeft); if (e.code === 'KeyW') togglePlayer(playerRight); }
    if (finishFlag) return;
    if (e.key === 'ArrowLeft') sortList(-1); if (e.key === 'ArrowRight') sortList(1); if (e.key === 'ArrowDown') sortList(0);
});

loadSorterData();
</script>
</body>
</html>
