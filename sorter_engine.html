<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorter Engine</title>
    <style>
        :root { 
            --primary: #b197fc; 
            --accent: #63e6be;  
            --bg: #1a1b1e;      
            --card-bg: #25262b; 
            --text: #ced4da;    
            --border: #373a40;
            --glow-color: rgba(177, 151, 252, 0.4);
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            display: flex; 
            flex-direction: column;
            height: 100vh; 
            height: 100dvh; 
        }
        
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 20px; background: #141517; border-bottom: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
        }
        .nav-btn {
            text-decoration: none; color: var(--text); font-size: 11px; font-weight: bold;
            padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

        header { flex-shrink: 0; padding: 8px 20px 0 20px; }
        #progressContainer { width: 100%; height: 4px; background: var(--border); margin: 4px auto; border-radius: 5px; }
        #progressBar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        
        .battle-area { 
            display: flex; 
            flex: 1; 
            justify-content: center; 
            align-items: stretch;
            gap: 15px; 
            padding: 10px 15px; 
            box-sizing: border-box;
            min-height: 0;
        }
        
        .choice-card { 
            flex: 1; display: flex; flex-direction: column;
            background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 18px; padding: 12px; cursor: pointer; 
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .choice-card.focus { flex: 3; border-color: var(--primary); box-shadow: 0 0 30px var(--glow-color); }
        .choice-card.dim { flex: 0.35; opacity: 0.2; filter: grayscale(0.8) blur(1px); }

        .song-name { 
            font-weight: 600; font-size: 1.4vw; 
            color: #fff; min-height: 2.2em; 
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; text-align: center;
            flex-shrink: 0;
            margin-bottom: 5px;
            padding: 0 5px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        
        .card-text-only .song-name { font-size: 2.5vw; flex: 1; -webkit-line-clamp: unset; }

        .visual-container { 
            flex: 1; width: 100%; border-radius: 12px; 
            overflow: hidden; border: 3px solid transparent;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            height: 100%; 
            background: transparent;
        }
        
        /* Layout for primary content containers */
        .visual-container > div[id^="content"] {
            width: 100%;
            height: 100%;
        }

        /* Videos and standard Images fill available space */
        .visual-container iframe[id^="yt"], 
        .visual-container img { 
            width: 100% !important; 
            height: 100% !important; 
            border: none; 
            display: block;
        }
        
        .visual-container img { object-fit: contain; }
        .visual-container iframe[id^="yt"] { object-fit: cover; background: #000; }
        
        /* Social Media Wrapper: Allows content to take height and scroll without squashing */
        .social-wrapper {
            width: 100% !important;
            height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Vertical center if space allows */
            background: transparent;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        
        /* Social media iframes (IG, SC) behavior */
        .social-wrapper iframe {
            object-fit: contain !important;
            max-width: 100%;
            width: 100%;
            height: 100%;
            border: none;
            margin: auto; /* Helps center vertically within flex */
        }
        
        /* Instagram Specific: Target max available space */
        .social-wrapper iframe[src*="instagram.com"] {
            min-height: 85%;
            max-height: 100%;
            max-width: 550px; /* Standard IG embed limit */
        }
        
        /* SoundCloud specific: Force Visual Mode to take space */
        .social-wrapper iframe[src*="soundcloud.com"] {
            height: 90% !important;
            min-height: 300px;
            width: 100% !important;
        }

        /* Twitter specific: prevent the widget from being forced to 100% card height */
        .twitter-tweet {
            margin: auto !important;
            height: auto !important;
        }

        .video-playing { border-color: var(--primary); }

        .img-nav {
            position: absolute; top: 0; bottom: 0;
            background: none; color: white; border: none;
            width: 60px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; transition: 0.2s; z-index: 10;
            opacity: 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }
        .visual-container:hover .img-nav { opacity: 1; }
        .img-nav:hover { color: var(--primary); scale: 1.1; }
        .img-nav.prev { left: 0; }
        .img-nav.next { right: 0; }
        
        .img-counter {
            position: absolute; bottom: 10px; right: 10px;
            background: none;
            color: white; padding: 4px 8px;
            border-radius: 10px; font-size: 10px; font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            z-index: 11;
        }

        .middle-controls { display: flex; flex-direction: column; justify-content: center; gap: 8px; width: 125px; flex-shrink: 0; }
        .btn { 
            padding: 8px; border: 1px solid var(--border); border-radius: 10px; 
            cursor: pointer; background: var(--card-bg); color: var(--text); 
            font-size: 10px; font-weight: bold; transition: 0.2s;
        }
        .btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-undo { color: #ff8787; border-color: rgba(255, 135, 135, 0.2); }

        .instruction-footer { 
            flex-shrink: 0; 
            padding: 10px; 
            font-size: 10px; 
            color: #5c5f66; 
            background: #141517; 
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .key-cap { color: var(--primary); font-weight: bold; padding: 0 4px; }
        
        #resultField { 
            display: none;
            overflow-y: auto; 
            background: var(--bg); 
            flex: 1; 
        }
        table { width: 85%; max-width: 600px; margin: 30px auto; border-collapse: collapse; border-radius: 12px; overflow: hidden; background: var(--card-bg); }
        th { background: var(--primary); color: #000; padding: 15px; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); color: #fff; text-align: center; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="top-bar">
        <a href="index.html" class="nav-btn">⇠ Library</a>
        <div>
            <select id="layoutPicker" onchange="changeLayout(this.value)" style="background: #000; color: #fff; border: 1px solid var(--border); border-radius: 5px; font-size: 10px; padding: 4px;">
                <option value="AZERTY">AZERTY</option>
                <option value="QWERTY">QWERTY</option>
            </select>
        </div>
    </div>

    <header id="main-header">
        <h1 id="page-title" style="margin:2px 0; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary);">Loading...</h1>
        <div id="battleNumber" style="font-size: 10px; opacity: 0.6; line-height: 1;">Checking Data...</div>
        <div id="progressContainer"><div id="progressBar"></div></div>
    </header>

    <div class="battle-area" id="battleArena">
        <div id="cardLeft" class="choice-card" onclick="if(!finishFlag) sortList(-1)">
            <div id="leftField" class="song-name">---</div>
            <div id="wrapperLeft" class="visual-container hidden" onclick="event.stopPropagation();">
                <button class="img-nav prev hidden" onclick="navigateMedia('Left', -1); event.stopPropagation();">‹</button>
                <div id="contentLeft"></div>
                <button class="img-nav next hidden" onclick="navigateMedia('Left', 1); event.stopPropagation();">›</button>
                <div id="counterLeft" class="img-counter hidden">1/1</div>
            </div>
            <span id="hintLeft" class="key-hint" style="margin-top:5px; font-size:9px; opacity:0.3;">[<span class="left-key-label">A</span>] PLAY</span>
        </div>

        <div class="middle-controls">
            <div class="btn" onclick="if(!finishFlag) sortList(0)">LIKE BOTH</div>
            <div class="btn" onclick="if(!finishFlag) sortList(0)">NO OPINION</div>
            <button id="undoBtn" class="btn btn-undo" onclick="undo()" disabled>UNDO</button>
        </div>

        <div id="cardRight" class="choice-card" onclick="if(!finishFlag) sortList(1)">
            <div id="rightField" class="song-name">---</div>
            <div id="wrapperRight" class="visual-container hidden" onclick="event.stopPropagation();">
                <button class="img-nav prev hidden" onclick="navigateMedia('Right', -1); event.stopPropagation();">‹</button>
                <div id="contentRight"></div>
                <button class="img-nav next hidden" onclick="navigateMedia('Right', 1); event.stopPropagation();">›</button>
                <div id="counterRight" class="img-counter hidden">1/1</div>
            </div>
            <span id="hintRight" class="key-hint" style="margin-top:5px; font-size:9px; opacity:0.3;">[<span class="right-key-label">Z</span>] PLAY</span>
        </div>
    </div>

    <div class="instruction-footer" id="main-footer">
        <span class="key-cap">← / →</span> WINNER | <span class="key-cap">↓</span> TIE | <span class="key-cap">Ctrl+Z</span> UNDO <span id="video-keys-hint">| <span class="key-cap" id="hint-left">A</span> / <span class="key-cap" id="hint-right">Z</span> VIDEO</span>
    </div>

    <div id="resultField"></div>

<script>
var namMember = [], mediaItems = [];
var playerLeft, playerRight, leftReady = false, rightReady = false;
var subIdxLeft = 0, subIdxRight = 0;

async function loadSorterData() {
    const urlParams = new URLSearchParams(window.location.search);
    const dataPath = urlParams.get('data');
    const battleLabel = document.getElementById('battleNumber');
    
    if (!dataPath) { battleLabel.style.color = "#ff8787"; battleLabel.innerText = "ERROR: No data file."; return; }

    try {
        const response = await fetch(dataPath);
        if (!response.ok) throw new Error("FILE NOT FOUND");
        const raw = await response.text();
        const data = JSON.parse(raw.replace(/\u00a0/g, ' ')); 
        
        namMember = data.names || [];
        mediaItems = data.media || data.ids || [];

        const fileName = dataPath.split('/').pop().replace('.json', '').replace(/[-_]/g, ' ');
        document.title = fileName.toUpperCase();
        document.getElementById('page-title').innerText = fileName;

        // Load YouTube API
        var ytTag = document.createElement('script');
        ytTag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(ytTag, document.getElementsByTagName('script')[0]);

        // Load Twitter Widgets API
        var twTag = document.createElement('script');
        twTag.src = "https://platform.twitter.com/widgets.js";
        twTag.charset = "utf-8";
        twTag.async = true;
        document.getElementsByTagName('script')[0].parentNode.insertBefore(twTag, document.getElementsByTagName('script')[0]);

    } catch (e) {
        battleLabel.style.color = "#ff8787";
        battleLabel.innerText = "LOAD ERROR: Check JSON.";
    }
}

function onYouTubeIframeAPIReady() {
    document.getElementById('contentLeft').innerHTML = '<div id="ytIframeLeft"></div>';
    document.getElementById('contentRight').innerHTML = '<div id="ytIframeRight"></div>';

    playerLeft = new YT.Player('ytIframeLeft', { 
        height: '100%', width: '100%', videoId: '', 
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 'onReady': () => { leftReady = true; checkPlayersReady(); }, 'onStateChange': (e) => handleStateChange(e, 'Left') }
    });
    playerRight = new YT.Player('ytIframeRight', { 
        height: '100%', width: '100%', videoId: '', 
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 'onReady': () => { rightReady = true; checkPlayersReady(); }, 'onStateChange': (e) => handleStateChange(e, 'Right') }
    });
}

function checkPlayersReady() { if (leftReady && rightReady) { initList(); updateUI(); } }

function handleStateChange(event, side) {
    const card = document.getElementById('card' + side);
    const other = document.getElementById(side === 'Left' ? 'cardRight' : 'cardLeft');
    const wrap = document.getElementById('wrapper' + side);
    if (event.data == 1) { wrap.classList.add('video-playing'); card.classList.add('focus'); other.classList.add('dim'); } 
    else { wrap.classList.remove('video-playing'); card.classList.remove('focus'); other.classList.remove('dim'); }
}

var lstMember = [], parent = [], equal = [], rec = [], historyStack = [];
var cmp1, cmp2, head1, head2, nrec, numQuestion, totalSize, finishSize, finishFlag = 0;

function initList(){
    var n = 0; lstMember[n] = namMember.map((_, i) => i); parent[n] = -1; totalSize = 0; n++;
    for (var i=0; i<lstMember.length; i++) {
        if(lstMember[i].length>=2) {
            var mid = Math.ceil(lstMember[i].length/2);
            lstMember[n] = lstMember[i].slice(0,mid); totalSize += lstMember[n].length; parent[n] = i; n++;
            lstMember[n] = lstMember[i].slice(mid); totalSize += lstMember[n].length; parent[n] = i; n++;
        }
    }
    equal = new Array(namMember.length + 1).fill(-1);
    cmp1 = lstMember.length-2; cmp2 = lstMember.length-1;
    head1 = head2 = nrec = finishSize = 0; numQuestion = 1;
}

function sortList(flag){
    saveState();
    if (flag < 0) processChoice(cmp1, 'head1');
    else if (flag > 0) processChoice(cmp2, 'head2');
    else { processChoice(cmp1, 'head1'); equal[rec[nrec-1]] = lstMember[cmp2][head2]; processChoice(cmp2, 'head2'); }
    if (head1 < lstMember[cmp1].length && head2 == lstMember[cmp2].length) { while (head1 < lstMember[cmp1].length) processChoice(cmp1, 'head1'); } 
    else if (head1 == lstMember[cmp1].length && head2 < lstMember[cmp2].length) { while (head2 < lstMember[cmp2].length) processChoice(cmp2, 'head2'); }
    if (head1 == lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
        for (var i=0; i<lstMember[cmp1].length+lstMember[cmp2].length; i++) lstMember[parent[cmp1]][i] = rec[i];
        lstMember.pop(); lstMember.pop(); cmp1 -= 2; cmp2 -= 2; head1 = head2 = nrec = 0;
    }
    if (cmp1 < 0) { finishFlag = 1; updateUI(); showResult(); } else { updateUI(); }
}

function processChoice(targetCmp, targetHead) {
    rec[nrec++] = lstMember[targetCmp][window[targetHead]++]; finishSize++;
    while (equal[rec[nrec-1]] != -1) { rec[nrec++] = lstMember[targetCmp][window[targetHead]++]; finishSize++; }
}

function navigateMedia(side, dir) {
    const idx = (side === 'Left') ? lstMember[cmp1][head1] : lstMember[cmp2][head2];
    const group = mediaItems[idx];
    if (!Array.isArray(group)) return;

    if (side === 'Left') {
        subIdxLeft = (subIdxLeft + dir + group.length) % group.length;
        renderSubMedia(side, group, subIdxLeft);
    } else {
        subIdxRight = (subIdxRight + dir + group.length) % group.length;
        renderSubMedia(side, group, subIdxRight);
    }
}

function renderSubMedia(side, group, index) {
    const content = document.getElementById('content' + side);
    const counter = document.getElementById('counter' + side);
    const hint = document.getElementById('hint' + side);
    const item = group[index];

    const isSC = typeof item === 'string' && item.includes('soundcloud.com');
    const isIG = typeof item === 'string' && item.includes('instagram.com');
    const isTwitter = typeof item === 'string' && (item.includes('twitter.com') || item.includes('x.com'));
    const isImg = typeof item === 'string' && item.trim().startsWith('http') && !isSC && !isIG && !isTwitter;
    const isVid = typeof item === 'string' && item.trim().length > 0 && !isImg && !isSC && !isIG && !isTwitter;

    content.innerHTML = '';
    hint.classList.add('hidden');
    counter.innerText = `${index + 1}/${group.length}`;

    if (isVid) {
        hint.classList.remove('hidden');
        content.innerHTML = `<div id="ytSub${side}"></div>`;
        new YT.Player(`ytSub${side}`, {
            height: '100%', width: '100%', videoId: item.split(/[?&]/)[0],
            playerVars: { 'autoplay': 0, 'controls': 1, 'start': (item.match(/[?&]t=([0-9]+)/) || [0,0])[1] },
            events: { 'onStateChange': (e) => handleStateChange(e, side) }
        });
    } else if (isSC) {
        content.innerHTML = `<div class="social-wrapper"><iframe scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(item)}&color=%23b197fc&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=true"></iframe></div>`;
    } else if (isIG) {
        const cleanUrl = item.split(/[?#]/)[0];
        const embedUrl = cleanUrl.endsWith('/') ? cleanUrl + 'embed/' : cleanUrl + '/embed/';
        content.innerHTML = `<div class="social-wrapper"><iframe src="${embedUrl}" frameborder="0" scrolling="no" allowtransparency="true" allow="encrypted-media"></iframe></div>`;
    } else if (isTwitter) {
        content.innerHTML = `<div class="social-wrapper"><div id="tweet-${side}-${index}" style="width:100%; max-width:550px; margin: auto;"></div></div>`;
        if (window.twttr && window.twttr.widgets) {
            window.twttr.widgets.createTweet(
                item.split('/').pop().split('?')[0], 
                document.getElementById(`tweet-${side}-${index}`), 
                { theme: 'dark', align: 'center', dnt: true, width: 550 }
            );
        } else {
            document.getElementById(`tweet-${side}-${index}`).innerHTML = `<a href="${item}" target="_blank" style="color:var(--primary); font-size:12px;">View on X</a>`;
        }
    } else if (isImg) {
        content.innerHTML = `<img src="${item}" alt="">`;
    }
}

async function updateUI(isUndo = false) {
    var percent = Math.floor(finishSize * 100 / totalSize);
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("battleNumber").innerHTML = finishFlag ? "FINISHED!" : `QUESTION ${numQuestion} (${percent}%)`;
    if (!finishFlag) {
        const LIdx = lstMember[cmp1][head1], RIdx = lstMember[cmp2][head2];
        document.getElementById("leftField").innerHTML = namMember[LIdx];
        document.getElementById("rightField").innerHTML = namMember[RIdx];
        refreshCard('Left', LIdx); refreshCard('Right', RIdx);
        if (!isUndo) numQuestion++;
    }
}

function refreshCard(side, index) {
    const card = document.getElementById('card' + side);
    const wrapper = document.getElementById('wrapper' + side);
    const content = document.getElementById('content' + side);
    const hint = document.getElementById('hint' + side);
    const entry = mediaItems[index];

    card.className = 'choice-card'; wrapper.classList.add('hidden'); hint.classList.add('hidden'); content.innerHTML = ''; 

    const isArr = Array.isArray(entry) && entry.length > 0;
    const isSC = typeof entry === 'string' && entry.includes('soundcloud.com');
    const isIG = typeof entry === 'string' && entry.includes('instagram.com');
    const isTwitter = typeof entry === 'string' && (entry.includes('twitter.com') || entry.includes('x.com'));
    const isImg = typeof entry === 'string' && entry.trim().startsWith('http') && !isSC && !isIG && !isTwitter;
    const isVid = typeof entry === 'string' && entry.trim().length > 0 && !isImg && !isSC && !isIG && !isTwitter;

    if (side === 'Left') subIdxLeft = 0; else subIdxRight = 0;

    if (isVid || isImg || isSC || isIG || isTwitter || isArr) {
        wrapper.classList.remove('hidden');
        const list = isArr ? entry : [entry];
        const isMulti = list.length > 1;
        
        wrapper.querySelector('.prev').classList.toggle('hidden', !isMulti);
        wrapper.querySelector('.next').classList.toggle('hidden', !isMulti);
        const counter = document.getElementById('counter' + side);
        counter.classList.toggle('hidden', !isMulti);

        renderSubMedia(side, list, 0);
    } else { 
        card.classList.add('card-text-only'); 
    }
}

function changeLayout(val) {
    const lK = (val === "AZERTY") ? "A" : "Q", rK = (val === "AZERTY") ? "Z" : "W";
    document.querySelectorAll('.left-key-label').forEach(el => el.innerText = lK);
    document.querySelectorAll('.right-key-label').forEach(el => el.innerText = rK);
    document.getElementById('hint-left').innerText = lK; document.getElementById('hint-right').innerText = rK;
}

function saveState() { historyStack.push(JSON.parse(JSON.stringify({lstMember, parent, equal, rec, cmp1, cmp2, head1, head2, nrec, numQuestion, finishSize, subIdxLeft, subIdxRight}))); document.getElementById("undoBtn").disabled = false; }
function undo() {
    if (historyStack.length === 0) return;
    var s = historyStack.pop(); Object.assign(window, s); finishFlag = 0; numQuestion--;
    document.getElementById("resultField").innerHTML = ""; if (historyStack.length === 0) document.getElementById("undoBtn").disabled = true;
    updateUI(true);
}

function togglePlayer(player) { if (!player || !player.getPlayerState) return; if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); }

function showResult() {
    var ranking = 1, sameRank = 1, str = "<table><tr><th>Rank</th><th>Name</th></tr>";
    for (var i=0; i<namMember.length; i++) {
        var idx = lstMember[0][i]; str += `<tr><td>${ranking}</td><td>${namMember[idx]}</td></tr>`;
        if (i < namMember.length - 1) { if (equal[idx] == lstMember[0][i+1]) sameRank++; else { ranking += sameRank; sameRank = 1; } }
    }
    document.getElementById('battleArena').style.display = 'none';
    document.getElementById('main-footer').style.display = 'none';
    const res = document.getElementById("resultField"); res.style.display = 'block'; res.innerHTML = str + "</table>";
}

window.addEventListener('keydown', (e) => {
    if (e.target.tagName == 'INPUT' || e.target.tagName == 'TEXTAREA') return;
    if (e.ctrlKey && e.key === 'z') { undo(); return; }
    if (finishFlag) return;
    if (e.key === 'ArrowLeft') sortList(-1); if (e.key === 'ArrowRight') sortList(1); if (e.key === 'ArrowDown') sortList(0);
});

loadSorterData();
</script>
</body>
</html>
