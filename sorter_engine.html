<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorter Engine</title>
    <style>
        :root { 
            --primary: #b197fc; 
            --accent: #63e6be;  
            --bg: #1a1b1e;      
            --card-bg: #25262b; 
            --text: #ced4da;    
            --border: #373a40;
            --glow-color: rgba(177, 151, 252, 0.4);
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            padding: 0; margin: 0; 
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }
        
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: #141517; border-bottom: 1px solid var(--border);
        }
        .nav-btn {
            text-decoration: none; color: var(--text); font-size: 11px; font-weight: bold;
            padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

        header { flex: 0 1 auto; padding: 10px; }
        #progressContainer { width: 95%; height: 4px; background: var(--border); margin: 5px auto; border-radius: 5px; }
        #progressBar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        
        .battle-area { 
            display: flex; flex: 1 1 auto; justify-content: center; align-items: stretch;
            gap: 20px; padding: 15px; box-sizing: border-box;
        }
        
        .choice-card { 
            flex: 1; display: flex; flex-direction: column;
            background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 18px; padding: 15px; cursor: pointer; 
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            justify-content: center; /* Center content when no video */
        }

        .choice-card.focus { flex: 2.8; border-color: var(--primary); box-shadow: 0 0 30px var(--glow-color); }
        .choice-card.dim { flex: 0.4; opacity: 0.25; filter: grayscale(0.8) blur(1px); }

        .song-name { 
            font-weight: 600; font-size: 1.8vw; 
            color: #fff; min-height: 2.2em; 
            display: flex; align-items: center; justify-content: center;
            transition: font-size 0.3s ease;
        }
        
        /* Fallback for Text-Only: Make font bigger */
        .text-only .song-name { font-size: 2.5vw; flex: 1; }

        .video-wrapper { 
            flex: 1; width: 100%; background: #000; border-radius: 12px; 
            overflow: hidden; border: 3px solid transparent;
            display: flex; align-items: center; justify-content: center;
            margin-top: 10px;
        }
        .video-wrapper div, .video-wrapper iframe { width: 100% !important; height: 100% !important; }
        .video-playing { border-color: var(--primary); }

        .middle-controls { display: flex; flex-direction: column; justify-content: center; gap: 10px; width: 130px; }
        .btn { 
            padding: 10px; border: 1px solid var(--border); border-radius: 10px; 
            cursor: pointer; background: var(--card-bg); color: var(--text); 
            font-size: 10px; font-weight: bold; transition: 0.2s;
        }
        .btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-undo { color: #ff8787; border-color: rgba(255, 135, 135, 0.2); }

        .instruction-footer { flex: 0 1 auto; padding: 10px; font-size: 10px; color: #5c5f66; background: #141517; }
        .key-cap { color: var(--primary); font-weight: bold; padding: 0 4px; }
        
        #resultField { overflow-y: auto; background: var(--bg); }
        table { width: 85%; max-width: 600px; margin: 30px auto; border-collapse: collapse; border-radius: 12px; overflow: hidden; background: var(--card-bg); }
        th { background: var(--primary); color: #000; padding: 15px; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); color: #fff; text-align: center; }
        tr:last-child td { border: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body class="loading-state">

    <div id="top-bar">
        <a href="index.html" class="nav-btn">⇠ Library</a>
        <div>
            <select id="layoutPicker" onchange="changeLayout(this.value)" style="background: #000; color: #fff; border: 1px solid var(--border); border-radius: 5px; font-size: 10px; padding: 4px;">
                <option value="AZERTY">AZERTY</option>
                <option value="QWERTY">QWERTY</option>
            </select>
        </div>
    </div>

    <header>
        <h1 id="page-title" style="margin:5px; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary);">Loading...</h1>
        <div id="battleNumber" style="font-size: 11px; opacity: 0.6;">Checking Data...</div>
        <div id="progressContainer"><div id="progressBar"></div></div>
    </header>

    <div class="battle-area">
        <div id="cardLeft" class="choice-card" onclick="if(!finishFlag) sortList(-1)">
            <div id="leftField" class="song-name">---</div>
            <div id="wrapperLeft" class="video-wrapper" onclick="event.stopPropagation();">
                <div id="playerLeft"></div>
            </div>
            <span class="key-hint left-hint" style="margin-top:10px; font-size:10px; opacity:0.4;">[<span class="left-key-label">A</span>] PLAY</span>
        </div>

        <div class="middle-controls">
            <div class="btn" onclick="if(!finishFlag) sortList(0)">LIKE BOTH</div>
            <div class="btn" onclick="if(!finishFlag) sortList(0)">NO OPINION</div>
            <button id="undoBtn" class="btn btn-undo" onclick="undo()" disabled>UNDO</button>
        </div>

        <div id="cardRight" class="choice-card" onclick="if(!finishFlag) sortList(1)">
            <div id="rightField" class="song-name">---</div>
            <div id="wrapperRight" class="video-wrapper" onclick="event.stopPropagation();">
                <div id="playerRight"></div>
            </div>
            <span class="key-hint right-hint" style="margin-top:10px; font-size:10px; opacity:0.4;">[<span class="right-key-label">Z</span>] PLAY</span>
        </div>
    </div>

    <div class="instruction-footer">
        <span class="key-cap">← / →</span> WINNER | <span class="key-cap">↓</span> TIE | <span class="key-cap">Ctrl+Z</span> UNDO <span id="video-keys-hint">| <span class="key-cap" id="hint-left">A</span> / <span class="key-cap" id="hint-right">Z</span> VIDEO</span>
    </div>

    <div id="resultField"></div>

<script>
// --- GLOBAL DATA ---
var namMember = [];
var videoIds = [];
var hasVideos = false;

// --- BOOTSTRAP: Load Data from JSON ---
async function loadSorterData() {
    const urlParams = new URLSearchParams(window.location.search);
    const dataPath = urlParams.get('data');
    
    if (!dataPath) {
        document.getElementById('battleNumber').innerText = "Error: No data file specified.";
        return;
    }

    try {
        const response = await fetch(dataPath);
        const data = await response.json();
        
        namMember = data.names || [];
        videoIds = data.ids || [];
        
        // Detect if we actually have videos to show
        hasVideos = videoIds.length > 0 && videoIds.some(id => id && id.trim() !== "");

        if (!hasVideos) {
            document.body.classList.add('text-only');
            document.querySelectorAll('.video-wrapper').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.key-hint').forEach(el => el.classList.add('hidden'));
            document.getElementById('video-keys-hint').classList.add('hidden');
        }

        // Update Title
        const cleanName = dataPath.split('/').pop().replace('.json', '').replace(/[-_]/g, ' ');
        document.title = cleanName.toUpperCase();
        document.getElementById('page-title').innerText = cleanName;

        if (hasVideos) {
            initYouTubePlayers();
        } else {
            // Skip YT API and start immediately
            initList();
            updateUI();
        }
    } catch (e) {
        console.error(e);
        document.getElementById('battleNumber').innerText = "Error loading data file.";
    }
}

function changeLayout(val) {
    const leftKey = (val === "AZERTY") ? "A" : "Q";
    const rightKey = (val === "AZERTY") ? "Z" : "W";
    document.querySelectorAll('.left-key-label').forEach(el => el.innerText = leftKey);
    document.querySelectorAll('.right-key-label').forEach(el => el.innerText = rightKey);
    document.getElementById('hint-left').innerText = leftKey;
    document.getElementById('hint-right').innerText = rightKey;
}

var playerLeft, playerRight;
var leftReady = false, rightReady = false;

function initYouTubePlayers() {
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
}

function onYouTubeIframeAPIReady() {
    playerLeft = new YT.Player('playerLeft', { 
        height: '100%', width: '100%', videoId: '', 
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 
            'onReady': () => { leftReady = true; checkPlayersReady(); },
            'onStateChange': (e) => handleStateChange(e, 'Left') 
        }
    });
    playerRight = new YT.Player('playerRight', { 
        height: '100%', width: '100%', videoId: '', 
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 
            'onReady': () => { rightReady = true; checkPlayersReady(); },
            'onStateChange': (e) => handleStateChange(e, 'Right')
        }
    });
}

function checkPlayersReady() { if (leftReady && rightReady) { initList(); updateUI(); } }

function handleStateChange(event, side) {
    const wrapper = document.getElementById('wrapper' + side);
    const card = document.getElementById('card' + side);
    const otherCard = document.getElementById(side === 'Left' ? 'cardRight' : 'cardLeft');

    if (event.data == 1) { // Playing
        wrapper.classList.add('video-playing');
        card.classList.add('focus');
        otherCard.classList.add('dim');
    } else {
        wrapper.classList.remove('video-playing');
        card.classList.remove('focus');
        otherCard.classList.remove('dim');
    }
}

var lstMember = [], parent = [], equal = [], rec = [], historyStack = [];
var cmp1, cmp2, head1, head2, nrec, numQuestion, totalSize, finishSize, finishFlag = 0;

function initList(){
    var n = 0;
    lstMember[n] = namMember.map((_, i) => i);
    parent[n] = -1; totalSize = 0; n++;
    for (var i=0; i<lstMember.length; i++) {
        if(lstMember[i].length>=2) {
            var mid = Math.ceil(lstMember[i].length/2);
            lstMember[n] = lstMember[i].slice(0,mid); totalSize += lstMember[n].length; parent[n] = i; n++;
            lstMember[n] = lstMember[i].slice(mid); totalSize += lstMember[n].length; parent[n] = i; n++;
        }
    }
    equal = new Array(namMember.length + 1).fill(-1);
    cmp1 = lstMember.length-2; cmp2 = lstMember.length-1;
    head1 = head2 = nrec = finishSize = 0; numQuestion = 1;
}

function sortList(flag){
    saveState();
    if (flag < 0) processChoice(cmp1, 'head1');
    else if (flag > 0) processChoice(cmp2, 'head2');
    else { processChoice(cmp1, 'head1'); equal[rec[nrec-1]] = lstMember[cmp2][head2]; processChoice(cmp2, 'head2'); }

    if (head1 < lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
        while (head1 < lstMember[cmp1].length) processChoice(cmp1, 'head1');
    } else if (head1 == lstMember[cmp1].length && head2 < lstMember[cmp2].length) {
        while (head2 < lstMember[cmp2].length) processChoice(cmp2, 'head2');
    }

    if (head1 == lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
        for (var i=0; i<lstMember[cmp1].length+lstMember[cmp2].length; i++) lstMember[parent[cmp1]][i] = rec[i];
        lstMember.pop(); lstMember.pop();
        cmp1 -= 2; cmp2 -= 2; head1 = head2 = nrec = 0;
    }
    if (cmp1 < 0) { finishFlag = 1; updateUI(); showResult(); } 
    else { updateUI(); }
}

function processChoice(targetCmp, targetHead) {
    rec[nrec++] = lstMember[targetCmp][window[targetHead]++];
    finishSize++;
    while (equal[rec[nrec-1]] != -1) { rec[nrec++] = lstMember[targetCmp][window[targetHead]++]; finishSize++; }
}

function updateUI(isUndo = false) {
    var percent = Math.floor(finishSize * 100 / totalSize);
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("battleNumber").innerHTML = finishFlag ? "FINISHED!" : `QUESTION ${numQuestion} (${percent}%)`;
    
    if (!finishFlag) {
        document.getElementById("leftField").innerHTML = namMember[lstMember[cmp1][head1]];
        document.getElementById("rightField").innerHTML = namMember[lstMember[cmp2][head2]];
        
        document.querySelectorAll('.choice-card').forEach(c => {
            c.classList.remove('focus');
            c.classList.remove('dim');
        });
        document.querySelectorAll('.video-wrapper').forEach(w => w.classList.remove('video-playing'));

        if (hasVideos) {
            const leftId = videoIds[lstMember[cmp1][head1]];
            const rightId = videoIds[lstMember[cmp2][head2]];
            
            if (leftId) playerLeft.cueVideoById(leftId);
            if (rightId) playerRight.cueVideoById(rightId);
        }
        
        if (!isUndo) numQuestion++;
    }
}

function saveState() {
    historyStack.push(JSON.parse(JSON.stringify({lstMember, parent, equal, rec, cmp1, cmp2, head1, head2, nrec, numQuestion, finishSize})));
    document.getElementById("undoBtn").disabled = false;
}

function undo() {
    if (historyStack.length === 0) return;
    var s = historyStack.pop();
    Object.assign(window, s);
    finishFlag = 0; numQuestion--;
    document.getElementById("resultField").innerHTML = "";
    if (historyStack.length === 0) document.getElementById("undoBtn").disabled = true;
    updateUI(true);
}

function togglePlayer(player) {
    if (!player || !player.getPlayerState) return;
    var state = player.getPlayerState();
    if (state === 1) player.pauseVideo();
    else player.playVideo();
}

function showResult() {
    var ranking = 1, sameRank = 1, str = "<table><tr><th>Rank</th><th>Name</th></tr>";
    for (var i=0; i<namMember.length; i++) {
        var idx = lstMember[0][i];
        str += `<tr><td>${ranking}</td><td>${namMember[idx]}</td></tr>`;
        if (i < namMember.length - 1) {
            if (equal[idx] == lstMember[0][i+1]) sameRank++;
            else { ranking += sameRank; sameRank = 1; }
        }
    }
    document.querySelector('.battle-area').style.display = 'none';
    document.getElementById("resultField").innerHTML = str + "</table>";
}

window.addEventListener('keydown', (e) => {
    if (e.target.tagName == 'INPUT' || e.target.tagName == 'TEXTAREA') return;
    if (e.ctrlKey && e.key === 'z') { undo(); return; }
    
    if (hasVideos) {
        if (e.code === 'KeyQ') togglePlayer(playerLeft);
        if (e.code === 'KeyW') togglePlayer(playerRight);
    }
    
    if (finishFlag) return;
    if (e.key === 'ArrowLeft') sortList(-1);
    if (e.key === 'ArrowRight') sortList(1);
    if (e.key === 'ArrowDown') sortList(0);
});

loadSorterData();
</script>
</body>
</html>
