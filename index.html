<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorter Library</title>
    <style>
		:root {
			--primary: #b197fc;
			--bg: #1a1b1e;
			--card-bg: #25262b;
			--text: #ced4da;
            --border: #373a40;
		}
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 0;
            margin: 0;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        h1 { font-size: 2rem; color: var(--primary); letter-spacing: 3px; margin-bottom: 40px; text-transform: uppercase; text-align: center; }

		.category-section { margin-bottom: 50px; }
		.category-title { 
			font-size: 1rem; color: #5c5f66; border-bottom: 1px solid var(--border); 
			padding-bottom: 8px; margin-bottom: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
		}

        /* Grid Logic for Full Display */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

		.sorter-link {
			background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px;
			padding: 20px; text-decoration: none; color: #fff; transition: 0.2s;
            display: flex; align-items: center; gap: 15px;
		}
		.sorter-link:hover {
			border-color: var(--primary); background: #2c2e33; transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
		}
		
		.icon { font-size: 24px; background: #141517; padding: 10px; border-radius: 10px; }
		.details { display: flex; flex-direction: column; overflow: hidden; }
		.title { font-size: 1rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: capitalize; }
		.path { font-size: 0.7rem; color: #5c5f66; }

		#loading { font-size: 1rem; color: var(--primary); text-align: center; animation: pulse 1.5s infinite; }
		@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>BATTLE LIBRARY</h1>
        <p id="loading">Scanning Data Files...</p>
        <div id="library-root"></div>
    </div>

<script>
    // --- SET THESE TO YOUR REPO INFO ---
    const GITHUB_USER = "Vikanya"; 
    const REPO_NAME = "Sorters";
    const ENGINE_FILE = "sorter_engine.html"; // The name of your single engine file

    async function buildLibrary() {
        // "recursive=1" scans all subfolders
        const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/git/trees/main?recursive=1`;
        const root = document.getElementById('library-root');
        const loading = document.getElementById('loading');

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (!data.tree) throw new Error("No files found");

            // 1. Filter for .json files (our new data format)
            let dataFiles = data.tree.filter(item => 
                item.path.endsWith('.json')
            );
            
            // Sort data files alphabetically
            dataFiles.sort((a, b) => a.path.localeCompare(b.path));

            // 2. Group them by folder (Category)
            const categories = {};
            dataFiles.forEach(file => {
                const parts = file.path.split('/');
                const category = parts.length > 1 ? parts[0] : "General";
                if (!categories[category]) categories[category] = [];
                categories[category].push(file);
            });

            loading.style.display = 'none';

            // 3. Render categories in REVERSE order
            const categoryKeys = Object.keys(categories).sort().reverse();

            categoryKeys.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = cat.replace(/[-_]/g, ' ');
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid';

                categories[cat].forEach(file => {
                    const fileName = file.path.split('/').pop();
                    const cleanName = fileName.replace(/\.json?$/i, '').replace(/[-_]/g, ' ');
                    
                    const card = document.createElement('a');
                    
                    // The link now points to the ENGINE, sending the JSON path as a parameter
                    card.href = `${ENGINE_FILE}?data=${encodeURIComponent(file.path)}`;
                    
                    card.className = 'sorter-link';
                    card.innerHTML = `
                        <div class="icon">📊</div>
                        <div class="details">
                            <span class="title">${cleanName}</span>
                            <span class="path">${file.path}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                root.appendChild(section);
            });

        } catch (error) {
            console.error(error);
            loading.innerText = "Error: Repository scanning failed. Check Username/Repo.";
        }
    }

    buildLibrary();
</script>
</body>
</html>
