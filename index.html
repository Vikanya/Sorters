<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop Sorter Portal</title>
    <style>
        :root { --primary: #fb6dac; --bg: #0a0a0a; --card-bg: #161616; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 50px 20px; }
        h1 { font-size: 3rem; color: var(--primary); margin-bottom: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 40px auto; }
        
        .sorter-link {
            background: var(--card-bg); border: 2px solid #222; border-radius: 15px;
            padding: 25px; text-decoration: none; color: white; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
        }
        .sorter-link:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(251, 109, 172, 0.2); }
        .title { font-size: 1.1rem; font-weight: bold; text-transform: capitalize; }
        .status { font-size: 0.8rem; color: #555; margin-top: 10px; }
        #loading { color: var(--primary); font-style: italic; }
    </style>
</head>
<body>

    <h1>SORTER PORTAL</h1>
    <p id="loading">Scanning repository for battles...</p>

    <div class="grid" id="sorter-grid">
        </div>

<script>
    // CONFIGURATION
    const GITHUB_USERNAME = "Vikanya";
    const REPO_NAME = "Sorters";

    async function fetchSorters() {
        const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`;
        const grid = document.getElementById('sorter-grid');
        const loading = document.getElementById('loading');

        try {
            const response = await fetch(url);
            const files = await response.json();

            // Filter for .html files, excluding index.html
            const htmlFiles = files.filter(file => 
                file.name.endsWith('.html') && 
                file.name.toLowerCase() !== 'index.html'
            );

            loading.style.display = 'none';

            htmlFiles.forEach(file => {
                const cleanName = file.name.replace(/\.html?$/i, '').replace(/[-_]/g, ' ');
                
                const card = document.createElement('a');
                card.href = file.name;
                card.className = 'sorter-link';
                card.innerHTML = `
                    <div style="font-size: 30px; margin-bottom: 10px;">🎵</div>
                    <div class="title">${cleanName}</div>
                    <div class="status">Click to Start Battle</div>
                `;
                grid.appendChild(card);
            });

        } catch (error) {
            console.error("Error fetching files:", error);
            loading.innerText = "Failed to load sorters. Make sure you are viewing this on GitHub Pages!";
        }
    }

    fetchSorters();
</script>
</body>
</html>
