<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorter Library</title>
    <style>
		:root {
			--primary: #D4BEE4;
			--bg: #F9F7F7;
			--card-bg: #FFFFFF;
			--text: #4A4A4A;
		}
		/* Change Category Title style */
		.category-title { 
			font-size: 1.2rem; color: #9BABB8; border-bottom: 2px solid #EEE; 
			padding-bottom: 5px; margin-bottom: 20px; font-weight: 300;
		}
		/* Change sorter-link style */
		.sorter-link {
			background: var(--card-bg); border: 1px solid #EEE; border-radius: 20px;
			padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
		}
		.sorter-link:hover {
			border-color: var(--primary); background: #FFF; box-shadow: 0 10px 20px rgba(212,190,228,0.3);
		}
		
		.icon { font-size: 24px; background: #000; padding: 10px; border-radius: 8px; }
		.details { display: flex; flex-direction: column; }
		.title { font-size: 1.1rem; font-weight: bold; text-transform: capitalize; }
		.path { font-size: 0.7rem; color: #555; }

		#loading { font-size: 1.2rem; color: var(--primary); animation: pulse 1.5s infinite; }
		@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>SORTER LIBRARY</h1>
        <p id="loading">Scanning Folders...</p>
        <div id="library-root"></div>
    </div>

<script>
    // --- SET THESE TO YOUR REPO INFO ---
    const GITHUB_USER = "Vikanya"; 
    const REPO_NAME = "Sorters";

    async function buildLibrary() {
        // "recursive=1" tells GitHub to look inside every subfolder
        const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/git/trees/main?recursive=1`;
        const root = document.getElementById('library-root');
        const loading = document.getElementById('loading');

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (!data.tree) throw new Error("No files found");

            // 1. Filter for .html files (excluding index)
            const sorters = data.tree.filter(item => 
                item.path.endsWith('.html') && 
                !item.path.toLowerCase().includes('index.html')
            );

            // 2. Group them by folder (Category)
            const categories = {};
            sorters.forEach(file => {
                const parts = file.path.split('/');
                const category = parts.length > 1 ? parts[0] : "General";
                if (!categories[category]) categories[category] = [];
                categories[category].push(file);
            });

            loading.style.display = 'none';

            // 3. Render the UI
            for (const cat in categories) {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = cat.replace(/[-_]/g, ' ');
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid';

                categories[cat].forEach(file => {
                    const fileName = file.path.split('/').pop();
                    const cleanName = fileName.replace(/\.html?$/i, '').replace(/[-_]/g, ' ');
                    
                    const card = document.createElement('a');
                    card.href = file.path;
                    card.className = 'sorter-link';
                    card.innerHTML = `
                        <div class="icon">🎧</div>
                        <div class="details">
                            <span class="title">${cleanName}</span>
                            <span class="path">${file.path}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                root.appendChild(section);
            }

        } catch (error) {
            console.error(error);
            loading.innerText = "Scanning Failed. Check your Username/Repo name.";
        }
    }

    buildLibrary();
</script>
</body>
</html>
