<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        :root { 
            --primary: #fb6dac; 
            --bg: #0a0a0a; 
            --card-bg: #161616;
            --text: #ffffff;
            --glow-color: #fb6dac;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            padding: 0; margin: 0; 
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; /* Prevents scrolling during battle */
        }
        
        #settings-corner { position: fixed; top: 10px; right: 10px; background: #222; padding: 8px; border-radius: 5px; z-index: 1000; font-size: 11px; }
        #settings-corner select { background: #000; color: #fff; border: 1px solid #444; }

        header { flex: 0 1 auto; padding: 10px; }
        #progressContainer { width: 95%; height: 4px; background: #222; margin: 5px auto; border-radius: 5px; }
        #progressBar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        
        /* The Arena: Vertical Expansion Fix */
        .battle-area { 
            display: flex; 
            flex: 1 1 auto; /* Takes all remaining height */
            justify-content: center; 
            align-items: stretch;
            gap: 20px; 
            padding: 20px;
            box-sizing: border-box;
        }
        
        .choice-card { 
            flex: 1; 
            display: flex; flex-direction: column;
            background: var(--card-bg); 
            border: 2px solid #222; 
            border-radius: 20px; 
            padding: 20px; 
            cursor: pointer; 
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative;
        }

        /* Focus Scaling */
        .choice-card.focus { flex: 2.5; border-color: var(--primary); }
        .choice-card.dim { flex: 0.5; opacity: 0.3; filter: blur(2px); }

        .song-name { 
            font-weight: 800; font-size: 1.8vw; 
            margin-bottom: 15px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        /* Video Wrapper: Maximizing Space */
        .video-wrapper { 
            flex: 1; /* This forces the video to grow vertically */
            width: 100%; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 3px solid transparent;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Forces the YT iframe to fill the flex container */
        .video-wrapper div, .video-wrapper iframe {
            width: 100% !important;
            height: 100% !important;
        }

        .video-playing { border-color: var(--glow-color); box-shadow: 0 0 40px var(--glow-color); }

        .middle-controls { display: flex; flex-direction: column; justify-content: center; gap: 15px; width: 140px; }
        .btn { padding: 15px 5px; border: 1px solid #333; border-radius: 10px; cursor: pointer; background: #111; color: white; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .btn:hover { background: var(--primary); border-color: white; }
        .btn-undo { color: #ff4d4d; border-color: #400; }

        .instruction-footer { flex: 0 1 auto; padding: 10px; font-size: 11px; color: #555; background: #050505; }
        .key-cap { color: var(--primary); font-weight: bold; }

        /* Result View needs to be scrollable */
        #resultField { overflow-y: auto; max-height: 100%; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th { background: var(--primary); padding: 15px; }
        td { padding: 12px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

    <div id="settings-corner">
        Layout: <select id="layoutPicker" onchange="changeLayout(this.value)">
            <option value="AZERTY">AZERTY</option>
            <option value="QWERTY">QWERTY</option>
        </select>
    </div>

    <header>
        <h1 id="page-title" style="margin:5px; font-size: 22px;">Song Sorter</h1>
        <div id="battleNumber">Connecting to YouTube...</div>
        <div id="progressContainer"><div id="progressBar"></div></div>
    </header>

    <div class="battle-area">
        <div id="cardLeft" class="choice-card" onclick="if(!finishFlag) sortList(-1)">
            <div id="leftField" class="song-name">---</div>
            <div id="wrapperLeft" class="video-wrapper" onclick="event.stopPropagation();">
                <div id="playerLeft"></div>
            </div>
            <span class="key-hint" style="margin-top:10px; font-size:12px;">[<span class="left-key-label">A</span>] PLAY</span>
        </div>

        <div class="middle-controls">
            <div class="btn" onclick="if(!finishFlag) sortList(0)">I Like Both</div>
            <div class="btn" onclick="if(!finishFlag) sortList(0)">No Opinion</div>
            <button id="undoBtn" class="btn btn-undo" onclick="undo()" disabled>UNDO</button>
        </div>

        <div id="cardRight" class="choice-card" onclick="if(!finishFlag) sortList(1)">
            <div id="rightField" class="song-name">---</div>
            <div id="wrapperRight" class="video-wrapper" onclick="event.stopPropagation();">
                <div id="playerRight"></div>
            </div>
            <span class="key-hint" style="margin-top:10px; font-size:12px;">[<span class="right-key-label">Z</span>] PLAY</span>
        </div>
    </div>

    <div class="instruction-footer">
        <span class="key-cap">← / →</span> Pick Winner | <span class="key-cap">↓</span> Tie | <span class="key-cap">Ctrl+Z</span> Undo | <span class="key-cap" id="hint-left">A</span> / <span class="key-cap" id="hint-right">Z</span> Toggle Video
    </div>

    <div id="resultField"></div>

<script>
// ==========================================
// DATA PASTE BOX
// ==========================================

`;

var namMember = rawNames.trim().split('\n').map(s => s.trim());
var videoIds = rawIds.trim().split('\n').map(s => s.trim());

function setAutoTitle() {
    let filename = window.location.pathname.split('/').pop();
    let cleanName = decodeURI(filename.replace(/\.html?$/i, '').replace(/[-_]/g, ' '));
    if (!cleanName) cleanName = "Song Sorter";
    document.title = cleanName;
    document.getElementById('page-title').innerText = cleanName;
}
setAutoTitle();

function changeLayout(val) {
    const leftKey = (val === "AZERTY") ? "A" : "Q";
    const rightKey = (val === "AZERTY") ? "Z" : "W";
    document.querySelectorAll('.left-key-label').forEach(el => el.innerText = leftKey);
    document.querySelectorAll('.right-key-label').forEach(el => el.innerText = rightKey);
    document.getElementById('hint-left').innerText = leftKey;
    document.getElementById('hint-right').innerText = rightKey;
}

var playerLeft, playerRight;
var leftReady = false, rightReady = false;
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

function onYouTubeIframeAPIReady() {
    playerLeft = new YT.Player('playerLeft', { 
        height: '100%', width: '100%', videoId: '', 
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 
            'onReady': () => { leftReady = true; checkPlayersReady(); },
            'onStateChange': (e) => handleStateChange(e, 'Left') 
        }
    });
    playerRight = new YT.Player('playerRight', { 
        height: '100%', width: '100%', videoId: '', 
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'iv_load_policy': 3 },
        events: { 
            'onReady': () => { rightReady = true; checkPlayersReady(); },
            'onStateChange': (e) => handleStateChange(e, 'Right')
        }
    });
}

function checkPlayersReady() { if (leftReady && rightReady) { initList(); updateUI(); } }

function handleStateChange(event, side) {
    const wrapper = document.getElementById('wrapper' + side);
    const card = document.getElementById('card' + side);
    const otherCard = document.getElementById(side === 'Left' ? 'cardRight' : 'cardLeft');

    if (event.data == 1) { // Playing
        wrapper.classList.add('video-playing');
        card.classList.add('focus');
        otherCard.classList.add('dim');
    } else {
        wrapper.classList.remove('video-playing');
        card.classList.remove('focus');
        otherCard.classList.remove('dim');
    }
}

var lstMember = [], parent = [], equal = [], rec = [], historyStack = [];
var cmp1, cmp2, head1, head2, nrec, numQuestion, totalSize, finishSize, finishFlag = 0;

function initList(){
    var n = 0;
    lstMember[n] = namMember.map((_, i) => i);
    parent[n] = -1; totalSize = 0; n++;
    for (var i=0; i<lstMember.length; i++) {
        if(lstMember[i].length>=2) {
            var mid = Math.ceil(lstMember[i].length/2);
            lstMember[n] = lstMember[i].slice(0,mid); totalSize += lstMember[n].length; parent[n] = i; n++;
            lstMember[n] = lstMember[i].slice(mid); totalSize += lstMember[n].length; parent[n] = i; n++;
        }
    }
    equal = new Array(namMember.length + 1).fill(-1);
    cmp1 = lstMember.length-2; cmp2 = lstMember.length-1;
    head1 = head2 = nrec = finishSize = 0; numQuestion = 1;
}

function sortList(flag){
    saveState();
    if (flag < 0) processChoice(cmp1, 'head1');
    else if (flag > 0) processChoice(cmp2, 'head2');
    else { processChoice(cmp1, 'head1'); equal[rec[nrec-1]] = lstMember[cmp2][head2]; processChoice(cmp2, 'head2'); }

    if (head1 < lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
        while (head1 < lstMember[cmp1].length) processChoice(cmp1, 'head1');
    } else if (head1 == lstMember[cmp1].length && head2 < lstMember[cmp2].length) {
        while (head2 < lstMember[cmp2].length) processChoice(cmp2, 'head2');
    }

    if (head1 == lstMember[cmp1].length && head2 == lstMember[cmp2].length) {
        for (var i=0; i<lstMember[cmp1].length+lstMember[cmp2].length; i++) lstMember[parent[cmp1]][i] = rec[i];
        lstMember.pop(); lstMember.pop();
        cmp1 -= 2; cmp2 -= 2; head1 = head2 = nrec = 0;
    }
    if (cmp1 < 0) { finishFlag = 1; updateUI(); showResult(); } 
    else { updateUI(); }
}

function processChoice(targetCmp, targetHead) {
    rec[nrec++] = lstMember[targetCmp][window[targetHead]++];
    finishSize++;
    while (equal[rec[nrec-1]] != -1) { rec[nrec++] = lstMember[targetCmp][window[targetHead]++]; finishSize++; }
}

function updateUI(isUndo = false) {
    var percent = Math.floor(finishSize * 100 / totalSize);
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("battleNumber").innerHTML = finishFlag ? "Finished!" : `Question No. ${numQuestion} (${percent}%)`;
    
    if (!finishFlag) {
        document.getElementById("leftField").innerHTML = namMember[lstMember[cmp1][head1]];
        document.getElementById("rightField").innerHTML = namMember[lstMember[cmp2][head2]];
        
        document.querySelectorAll('.choice-card').forEach(c => c.className = 'choice-card');
        document.querySelectorAll('.video-wrapper').forEach(w => w.className = 'video-wrapper');

        playerLeft.cueVideoById(videoIds[lstMember[cmp1][head1]]);
        playerRight.cueVideoById(videoIds[lstMember[cmp2][head2]]);
        if (!isUndo) numQuestion++;
    }
}

function saveState() {
    historyStack.push(JSON.parse(JSON.stringify({lstMember, parent, equal, rec, cmp1, cmp2, head1, head2, nrec, numQuestion, finishSize})));
    document.getElementById("undoBtn").disabled = false;
}

function undo() {
    if (historyStack.length === 0) return;
    var s = historyStack.pop();
    Object.assign(window, s);
    finishFlag = 0; numQuestion--;
    document.getElementById("resultField").innerHTML = "";
    if (historyStack.length === 0) document.getElementById("undoBtn").disabled = true;
    updateUI(true);
}

function togglePlayer(player) {
    if (!player || !player.getPlayerState) return;
    var state = player.getPlayerState();
    if (state === 1) player.pauseVideo();
    else player.playVideo();
}

function showResult() {
    var ranking = 1, sameRank = 1, str = "<table><tr><th>Rank</th><th>Song</th></tr>";
    for (var i=0; i<namMember.length; i++) {
        var idx = lstMember[0][i];
        str += `<tr><td>${ranking}</td><td>${namMember[idx]}</td></tr>`;
        if (i < namMember.length - 1) {
            if (equal[idx] == lstMember[0][i+1]) sameRank++;
            else { ranking += sameRank; sameRank = 1; }
        }
    }
    document.querySelector('.battle-area').style.display = 'none';
    document.getElementById("resultField").innerHTML = str + "</table>";
}

window.addEventListener('keydown', (e) => {
    if (e.target.tagName == 'INPUT' || e.target.tagName == 'TEXTAREA') return;
    if (e.ctrlKey && e.key === 'z') { undo(); return; }
    if (e.code === 'KeyQ') togglePlayer(playerLeft);
    if (e.code === 'KeyW') togglePlayer(playerRight);
    if (finishFlag) return;
    if (e.key === 'ArrowLeft') sortList(-1);
    if (e.key === 'ArrowRight') sortList(1);
    if (e.key === 'ArrowDown') sortList(0);
});
</script>

</html>
